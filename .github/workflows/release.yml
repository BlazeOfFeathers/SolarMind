name: Release

# Creates a GitHub release (and tag) for every new version in manifest.json,
# so HACS shows real version numbers and offers updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/solarmind/manifest.json'))['version'])")
          const=$(python3 -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('custom_components/solarmind/const.py').read()).group(1))")
          if [ "$version" != "$const" ]; then
            echo "manifest.json ($version) and const.py ($const) disagree" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "SolarMind $TAG" --generate-notes
